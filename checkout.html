<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа | Darkness Store</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        :root {
            --bg-color: #0a0a0f;
            --text-color: #ffffff;
            --primary: #7b2cbf;
            --secondary: #c77dff;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;}

        .checkout-box { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 40px; width: 100%; max-width: 500px; backdrop-filter: blur(15px); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        h2 { text-align: center; margin-bottom: 30px; font-size: 28px; }
        h2 span { background: linear-gradient(90deg, var(--secondary), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; }
        
        input, select {
            width: 100%;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        
        input:focus, select:focus { border-color: var(--secondary); box-shadow: 0 0 10px rgba(199, 125, 255, 0.2); }

        .btn-submit {
            width: 100%;
            padding: 18px;
            margin-top: 20px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(123, 44, 191, 0.4); }

        .back-link { display: block; text-align: center; margin-top: 20px; color: #aaa; text-decoration: none; font-size: 14px; transition: 0.3s; }
        .back-link:hover { color: white; }
    </style>
</head>
<body>

    <div class="checkout-box">
        <h2><span>Darkness Store</span><br>Оформление заказа</h2>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label>Ваше имя</label>
                <input type="text" placeholder="Иван Иванов" required>
            </div>

            <div class="form-group">
                <label>Номер телефона</label>
                <input type="tel" placeholder="+7 (___) ___-__-__" required>
            </div>

            <div class="form-group">
                <label>Электронная почта</label>
                <input type="email" placeholder="example@mail.ru" required>
            </div>

            <div class="form-group">
                <label>Способ оплаты</label>
                <select>
                    <option>Картой при получении</option>
                    <option>Наличными курьеру</option>
                    <option>СБП (Система быстрых платежей)</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Подтвердить заказ</button>
        </form>

        <a href="index.html" class="back-link">← Вернуться в каталог</a>
    </div>

</body>
</html>
